version: '3.8'
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediagallery-frontend
    ports:
      - "3000:80"